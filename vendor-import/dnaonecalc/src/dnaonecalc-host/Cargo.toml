[package]
name = "dnaonecalc-host"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["shell-ui"]
shell-ui = ["dep:leptos", "dep:dnacalc-formula-skin-leptos"]
seam-tests = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
roxmltree = "0.21"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "HtmlTextAreaElement", "HtmlInputElement", "HtmlElement", "HtmlAnchorElement", "InputEvent", "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "MouseEventInit", "Event", "EventInit", "EventTarget", "Window", "Document", "Element", "Node", "NodeList", "CssStyleDeclaration", "DomRect", "Blob", "BlobPropertyBag", "Url", "File", "FileList", "FileReader", "Storage"] }
wasm-bindgen = "=0.2.117"
oxfml_core = { path = "../../../OxFml/crates/oxfml_core" }
oxfunc_core = { path = "../../../OxFunc/crates/oxfunc_core" }
dnacalc-skin-ir = { path = "../../../DnaTreeCalc/src/dnacalc-skin-ir" }
dnacalc-formula-ux-core = { path = "../../../DnaTreeCalc/src/dnacalc-formula-ux-core" }
dnacalc-formula-skin-leptos = { path = "../../../DnaTreeCalc/src/dnacalc-formula-skin-leptos", optional = true }
dnacalc-extension-host-core = { path = "../../../DnaTreeCalc/src/dnacalc-extension-host-core" }
dnaonecalc-core = { path = "../dnaonecalc-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["ssr"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["csr"], optional = true }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "=0.3.67"

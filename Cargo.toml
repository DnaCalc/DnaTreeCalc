[workspace]
resolver = "2"
members = [
    "src/dnacalc-host-core",
    "src/dnacalc-formula-ux-core",
    "src/dnacalc-formula-skin-leptos",
    "src/dnatreecalc-desktop",
    "src/dnacalc-extension-host-core",
    "src/dnacalc-bridge",
    "src/dnacalc-shell",
    "src/dnacalc-skin-ir",
    "src/dnacalc-skin-leptos",
    "src/dnacalc-stage-notebook",
    "src/dnacalc-strand",
    "src/dnatreecalc-host",
    "src/dnatreecalc-skin-framework",
    "src/dnatreecalc-shell",
    "src/dnatreecalc-skins",
    "src/dnatreecalc-web",
    "src/dnatreecalc-worker",
    # Bench crates (D5): imported from DnaOneCalc in dtc-tsc.1, renamed
    # dnaonecalc-* -> dnacalc-bench-* in dtc-tsc.2. Source repo is archived.
    "src/dnacalc-bench-core",
    "src/dnacalc-bench-host",
    "src/dnacalc-bench-desktop",
    # Dev-only crate (dtc-tsc.3): pinned tests for the D5 crate-tier
    # dependency law (F/P/T0 gates). Never a dependency of any other member.
    "src/dnacalc-arch-gates",
    # App skeletons (dtc-tsc.9): compose the S0 substrate into two runnable
    # products, each with a browser (WASM/trunk) entry and a Tauri desktop
    # shell. `dnacalc-bench-app` is TF (bench-host = oxfml+oxfunc, no oxcalc);
    # `dnacalc-app` is the Calc app root (TC-adjacent via dnatreecalc-host).
    "src/dnacalc-bench-app",
    "src/dnacalc-bench-app-desktop",
    "src/dnacalc-app",
    "src/dnacalc-app-desktop",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
oxcalc_core = { package = "oxcalc-core", path = "../OxCalc/src/oxcalc-core" }
oxfml_core = { path = "../OxFml/crates/oxfml_core" }
oxfunc_core = { path = "../OxFunc/crates/oxfunc_core" }

# Keep local/browser debug artifacts small enough to compile and instantiate.
# The skin suite's Leptos view types produce very large debuginfo on Windows;
# full-symbol debug builds have already hit OS paging limits in this repo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
debug = 0
lto = "thin"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

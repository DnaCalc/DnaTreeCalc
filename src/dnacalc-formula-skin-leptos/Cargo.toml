[package]
name = "dnacalc-formula-skin-leptos"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dnacalc-skin-ir = { path = "../dnacalc-skin-ir" }
leptos = { version = "0.8", features = ["csr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "HtmlElement", "HtmlTextAreaElement", "Node", "NodeList", "Window"] }

[lints]
workspace = true

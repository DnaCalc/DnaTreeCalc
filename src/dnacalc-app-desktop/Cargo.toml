# dnacalc-app-desktop — the DNA Calc Tauri desktop shell (dtc-tsc.9).
#
# TIER: Calc app root (desktop). A thin Tauri v2 wrapper whose window loads the
# committed `dnacalc-app` WASM frontend (frontendDist below). Not TP; not
# F-gated (the Calc product legitimately reaches the oxcalc engine).
#
# Tauri-config duplication with `dnacalc-bench-app-desktop` is recorded as DEBT
# in the bead close note.
[package]
name = "dnacalc-app-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The `open_xlsx_file` / `save_xlsx_file` commands (W011 Wave 1.5, bead
# dtc-j7n8.10): native file dialogs (rfd) + plain `std::fs` reads/writes that
# hand raw `.xlsx` BYTES to / take them from the WASM frontend, which owns the
# host commands (`OpenXlsxBytes` / `SaveActiveXlsx`). Bytes only is deliberate
# — it keeps this shell free of any `dnacalc-*` / OxDoc edge; the same rfd
# pattern the sibling `dnacalc-bench-app-desktop` shell uses.
rfd = "0.15"
serde = { workspace = true }

[lints]
workspace = true

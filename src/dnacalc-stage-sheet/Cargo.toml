# dnacalc-stage-sheet — the Sheet stage (S3), TP tier.
#
# TP tier (SHELL_SPEC.md §2): may depend on `dnacalc-skin-ir` (T0) + Leptos +
# the TP crates — NEVER any `ox*` engine crate (P-gate). The Sheet stage is the
# Excel-strict grid: a Canvas2D tile renderer + one DOM overlay editor over a
# RenderPlan-IR whose geometry/hit-test invariants are unit-tested (Foundation
# doctrine). It needs `dnacalc-shell` (the StageSurface contract),
# `dnacalc-skin-ir` (the GridProjection it renders), and — since S3.6 — the
# `dnacalc-bridge` degrade editor for the single active-cell overlay. All three
# are TP crates (verified ox-free via `cargo tree -e normal`).
[package]
name = "dnacalc-stage-sheet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]

[dependencies]
dnacalc-skin-ir = { path = "../dnacalc-skin-ir" }
dnacalc-shell = { path = "../dnacalc-shell" }
# S3.6 overlay editor: the shared degrade formula editor. A TP crate
# (`dnacalc-skin-ir` + `dnacalc-strand` + Leptos only), so the P-gate stays green
# — no `ox*` enters the Sheet's normal graph (verified via `cargo tree -e normal`).
dnacalc-bridge = { path = "../dnacalc-bridge" }
# S3.5 Canvas2D renderer. `web-sys` is NOT an `ox*` crate, so the P-gate admits
# it in this TP crate (verified via `cargo tree -e normal`). It compiles on both
# native and wasm — its imported functions are link-time stubs natively (never
# called under the `ssr` test build), so the draw layer needs no `cfg` gate.
# `MouseEvent` (S3.6) is needed for `offset_x`/`offset_y` on the canvas click
# handler; `WheelEvent` (S3.9) for `delta_x`/`delta_y` on the scroll handler.
# `PointerEvent` (SHELL_SPEC §1.1 touch pass) covers tap/pan/pinch on the
# canvas; `Performance` timestamps the double-tap classifier.
# `Window::request_animation_frame` (the S3.9 RAF coalescer flush boundary) needs
# no extra feature beyond `Window`, already enabled. They are declared here
# rather than relied on transitively via Leptos.
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "DomRect",
    "MouseEvent",
    "PointerEvent",
    "Performance",
    "WheelEvent",
    "ResizeObserver",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["csr"] }

# DEV-ONLY (native): geometry / render-plan tests drive the REAL
# `dnacalc-host-core` demo workbook so the RenderPlan is proven over a genuine
# `GridProjection`, not a hand-mock. A `[dev-dependencies]` edge never appears
# in `cargo tree -e normal`, so the P-gate (no ox* in the TP artifact) stays
# green while the tests still exercise engine truth. Native only: host-core is
# not a wasm target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dnacalc-host-core = { path = "../dnacalc-host-core" }

[lints]
workspace = true

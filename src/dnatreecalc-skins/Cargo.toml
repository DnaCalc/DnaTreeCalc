[package]
name = "dnatreecalc-skins"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dnatreecalc-skin-framework = { path = "../dnatreecalc-skin-framework" }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["csr"] }

[lints]
workspace = true

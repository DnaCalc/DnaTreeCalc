[package]
name = "dnacalc-conform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "W012 measured-Excel conformance instrument (TC tier): opens Excel-authored .xlsx through the product's own path (dnacalc-host-core), forces a recalc, and scores every formula cell against Excel's cached <v> with a provenance-first verdict ladder. Never a dependency of any other workspace crate."

[lib]
path = "src/lib.rs"

[[bin]]
name = "dnacalc-conform"
path = "src/main.rs"

# TC tier (Foundation/notes/PROGRAM_INVESTIGATION_2026-09-10.md Appendix A):
# host-core is the path the product runs; oxcalc_core/oxdoc_model/oxdoc_xlsx
# are the types that path speaks. No zip crate — bytes go to OxDoc as-is.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
dnacalc-host-core = { path = "../dnacalc-host-core" }
# The skin-IR calc-mode projection `WorkbookSession::set_calc_mode` takes
# (the bench flips Manual/Automatic through the product's own verb). T0
# tier, already a host-core dependency: a new edge, not a new crate.
dnacalc-skin-ir = { path = "../dnacalc-skin-ir" }
oxcalc_core.workspace = true
oxfunc_core.workspace = true
oxdoc_model.workspace = true
oxdoc_xlsx.workspace = true
# Corpus identity: the artifact retains a sha256 per workbook and the sorted
# set. `sha2` 0.10 is already resolved in this workspace's Cargo.lock (a
# transitive dependency of the Tauri shells), so this is a new edge, not a
# new crate; hand-rolling SHA-256 for a conformance instrument would be the
# casual choice.
sha2 = "0.10"

[lints]
workspace = true

# Dev-only fixture zipper (the W011/W012 committed-parts pattern): tests zip
# `fixtures/w012/false_green/parts/**` in memory through OxDoc's own
# conformance crate. Never promote this to a normal dependency.
[dev-dependencies]
oxdoc_conformance.workspace = true

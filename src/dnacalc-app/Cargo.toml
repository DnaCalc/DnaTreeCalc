# dnacalc-app — the DNA Calc product skeleton (dtc-tsc.9).
#
# TIER: Calc app root (TC-adjacent). It composes the TP shell + bridge, but its
# dispatcher drives a real `dnacalc-host-core` workbook session through
# `dnatreecalc-host`'s `WorkbookHostDispatcher`, so oxcalc IS in this graph by
# design. It is therefore NOT a TP crate and is deliberately NOT added to
# `dnacalc-arch-gates::TP_CRATES` (the coordinator's tier call: an app root that
# touches host-core is TC-adjacent, not presentation).
#
# `cdylib + rlib`: the browser (trunk) build mounts the `cdylib` via `start()`;
# native `cargo test` compiles the `rlib` and exercises the degrade adapter's
# three-way grid-entry outcome against the real host-core engine.
[package]
name = "dnacalc-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dnacalc-skin-ir = { path = "../dnacalc-skin-ir" }
dnacalc-skin-leptos = { path = "../dnacalc-skin-leptos" }
dnacalc-strand = { path = "../dnacalc-strand" }
dnacalc-shell = { path = "../dnacalc-shell" }
dnacalc-bridge = { path = "../dnacalc-bridge" }
dnatreecalc-host = { path = "../dnatreecalc-host" }

[dev-dependencies]
# Drive the real host-core workbook engine directly in native outcome tests
# (the three-way EnterGridCell outcome the degrade path renders).
dnacalc-host-core = { path = "../dnacalc-host-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["csr"] }
wasm-bindgen = "=0.2.117"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "console"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "HtmlElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "InputEventInit",
    "KeyboardEvent",
    "KeyboardEventInit",
    "Node",
    "NodeList",
    "Window",
] }

[lints]
workspace = true

[package]
name = "dnatreecalc-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
oxcalc_core.workspace = true
oxfml_core.workspace = true
oxfunc_core.workspace = true
dnacalc-host-core = { path = "../dnacalc-host-core" }
dnatreecalc-skin-framework = { path = "../dnatreecalc-skin-framework" }
dnatreecalc-shell = { path = "../dnatreecalc-shell" }
dnatreecalc-skins = { path = "../dnatreecalc-skins" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["csr"] }

[dev-dependencies]
oxfunc_core.workspace = true

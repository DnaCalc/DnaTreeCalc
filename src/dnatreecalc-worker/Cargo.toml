[package]
name = "dnatreecalc-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dnatreecalc-host = { path = "../dnatreecalc-host" }
dnatreecalc-skin-framework = { path = "../dnatreecalc-skin-framework" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["csr"] }
wasm-bindgen = "=0.2.117"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }

[lints]
workspace = true

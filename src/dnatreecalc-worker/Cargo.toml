[package]
name = "dnatreecalc-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

# Shared worker-boundary message types only — the worker runtime lives in
# dnatreecalc-web (trunk builds the web crate itself as the no-modules worker).
[dependencies]
dnatreecalc-host = { path = "../dnatreecalc-host" }
dnatreecalc-skin-framework = { path = "../dnatreecalc-skin-framework" }
serde = { workspace = true }

[lints]
workspace = true

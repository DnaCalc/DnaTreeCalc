[package]
name = "dnatreecalc-skin-framework"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Compatibility facade: the crate was split into `dnacalc-skin-ir` (pure wire
# protocol) and `dnacalc-skin-leptos` (Leptos mounting layer) in bead
# dtc-ajl.1. This crate now re-exports `dnacalc-skin-leptos` so the ~25
# existing consumers keep their `dnatreecalc_skin_framework::…` imports
# unchanged; a later cleanup bead retargets them and retires this facade.

[dependencies]
dnacalc-skin-leptos = { path = "../dnacalc-skin-leptos" }

[lints]
workspace = true

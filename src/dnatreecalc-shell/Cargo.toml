[package]
name = "dnatreecalc-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dnatreecalc-skin-framework = { path = "../dnatreecalc-skin-framework" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.117"
web-sys = { version = "0.3", features = ["Element", "EventTarget", "KeyboardEvent"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["csr"] }

[lints]
workspace = true

[package]
name = "dnatreecalc-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dnatreecalc-host = { path = "../dnatreecalc-host" }
dnatreecalc-shell = { path = "../dnatreecalc-shell" }
dnatreecalc-skin-framework = { path = "../dnatreecalc-skin-framework" }
dnatreecalc-skins = { path = "../dnatreecalc-skins" }
dnatreecalc-worker = { path = "../dnatreecalc-worker" }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["csr"] }
wasm-bindgen = "=0.2.117"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Storage",
    "Location",
    "Worker",
    "WorkerType",
    "WorkerOptions",
    "MessageEvent",
    "DedicatedWorkerGlobalScope",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "console",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
wasm-bindgen-futures = "0.4"
# Extra web-sys features the browser-smoke tests need on top of the lib's set
# (feature unification applies them to the test build only, never the app).
web-sys = { version = "0.3", features = [
    "History",
    "Node",
    "NodeList",
    "HtmlInputElement",
    "KeyboardEvent",
    "KeyboardEventInit",
] }

[lints]
workspace = true
